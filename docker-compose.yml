services:
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-5173}:5173"
    volumes:
      - ./frontend/src:/app/frontend/src
      - ./frontend/index.html:/app/frontend/index.html
    depends_on:
      api:
        condition: service_started

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:?Completar POSTGRES_USER}:${POSTGRES_PASSWORD:?Completar POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:?Completar POSTGRES_DB}?schema=public&connect_timeout=2&pool_timeout=2&socket_timeout=2&connection_limit=3
      # URL que usa el navegador: arma los enlaces de los emails y valida el Origin.
      APP_URL: ${APP_URL:-http://localhost:${FRONTEND_PORT:-5173}}
      MAIL_TRANSPORT: ${MAIL_TRANSPORT:-smtp}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      MAIL_FROM: ${MAIL_FROM:-}
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_SECURE: ${SMTP_SECURE:-}
      # Archivos privados (logos): volumen propio, nunca servido como estático.
      FILES_DIR: /app/backend/data/files
      # Opcionales: sin ellas la pantalla informa que falta configurar Google.
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
    volumes:
      - workshop_files:/app/backend/data
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_started

  # Buzón local: captura los emails sin enviarlos. Interfaz en http://localhost:8025.
  mailpit:
    image: axllent/mailpit:v1.27.10
    ports:
      - "127.0.0.1:${MAILPIT_PORT:-8025}:8025"

  postgres:
    image: postgres:17.11-bookworm
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Completar POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Completar POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:?Completar POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 10s

volumes:
  postgres_data:
  workshop_files:
