name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      # URL ficticia para Prisma; las pruebas actuales sustituyen la consulta.
      # No conecta con una base ni necesita secretos de GitHub.
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/talleres_ci
    steps:
      - name: Obtener código
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Instalar pnpm desde packageManager
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Configurar Node y caché de pnpm
        uses: actions/setup-node@v6
        with:
          node-version: '22.23.4'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Instalar dependencias reproducibles
        run: pnpm install --frozen-lockfile

      - name: Validar esquema Prisma
        run: pnpm --filter backend exec prisma validate

      - name: Comprobar tipos y compilar frontend y backend
        run: pnpm build

      - name: Ejecutar pruebas de frontend y backend
        run: pnpm test
